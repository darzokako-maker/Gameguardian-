name: NovaMem Stealth APK Builder

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Depodan Çek
      uses: actions/checkout@v4

    - name: Java JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Android NDK (ARM64 Derleyici) ve CMake Kurulumu
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '25.2.9519653'
        cmake-version: '3.22.1'

    - name: Gradle Komut Yetkilerini Ayarla
      run: chmod +x gradlew

    - name: Projeyi APK Olarak Derle
      run: ./gradlew assembleRelease

    # 🚨 YENİ ADIM: Telefonun APK'yı kabul etmesi için otomatik dijital imza basıyoruz
    - name: APK Dosyasını İmzala (Sign)
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: "" # Boş bırakıldığında Actions bizim için geçici bir test anahtarı (debug/test key) üretir
        alias: test_alias
        keyStorePassword: test_password
        keyPassword: test_password

    - name: İmzalı APK Dosyasını Çıktı Olarak Ver (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: NovaMemStealthBypass-Yüklenebilir
        # Alttaki yol sayesinde sadece az önce imzalanmış olan güvenli APK'yı çıktı verir
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        
